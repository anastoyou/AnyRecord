project_id = "recordly-feedback"

[functions.submit-feedback]
# The handler verifies the bearer token with auth.getUser before doing any work.
verify_jwt = false

[functions.submit-export-error]
verify_jwt = false

[functions.cloudinary]
# The handler verifies bearer tokens through auth.getUser and serves the public OAuth callback.
verify_jwt = false

# External OAuth Providers (GitHub)
[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:43821/auth/callback"
